name = "odo"
main = "src/index.ts"
compatibility_date = "2024-12-05"

# One visit counter per handle
[[durable_objects.bindings]]
name = "COUNTERS"
class_name = "VisitCounter"

# The Workers Free plan only supports SQLite-backed Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VisitCounter"]

# The connected Spotify account behind /spotify
[[durable_objects.bindings]]
name = "SPOTIFY"
class_name = "SpotifyAccount"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SpotifyAccount"]

# Client ID from developer.spotify.com/dashboard (not secret). The client secret
# goes in with `npx wrangler secret put SPOTIFY_CLIENT_SECRET`.
[vars]
SPOTIFY_CLIENT_ID = ""

# Sprite images ship inside the worker as binary data
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = false
