name = "odo"
main = "src/index.ts"
compatibility_date = "2024-12-05"

# One visit counter per handle
[[durable_objects.bindings]]
name = "COUNTERS"
class_name = "VisitCounter"

# The Workers Free plan only supports SQLite-backed Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VisitCounter"]

# Sprite images ship inside the worker as binary data
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = false
